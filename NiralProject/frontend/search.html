<!DOCTYPE html>
<html>
<head>
    <title>Land Litigation Verification System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <script>
        if (localStorage.getItem("loggedIn") !== "true") {
              window.location.href = "login.html";
    }
    </script>

    <header>
        <h1>
            Land Litigation Verification System<br>
            நில வழக்கு சரிபார்ப்பு அமைப்பு
        </h1>
    </header>
    <nav>
      <a href="index.html">Home / முகப்பு</a>
      <a href="search.html">Search / தேடல்</a>
      <a href="admin.html">Admin / நிர்வாகம்</a>
    </nav>
    <div class="container">
        <h2>
            Search Land Details / நில விவரங்களை தேடவும்
        </h2>

        <label>
            District / மாவட்டம்
        </label>
        <input type="text" id="district" placeholder="Enter District">

        <label>
            Village / கிராமம்
        </label>
        <input type="text" id="village" placeholder="Enter Village">

        <label>
            Survey Number / சர்வே எண்
        </label>
        <input type="text" id="survey" placeholder="Enter Survey Number">   

        <button onclick="searchLand()">
            Search / தேடு
        </button>

        <div id="result"></div>
    </div>
    
    <button onclick="window.print()" id="printBtn">
        Print Report / அறிக்கை அச்சிடு
    </button>

    <script src="js/app.js"></script>

</body>
</html>
